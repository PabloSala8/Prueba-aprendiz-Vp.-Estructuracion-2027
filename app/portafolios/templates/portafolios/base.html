<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Portafolios de inversión{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand">Portafolios de inversión</span>
            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'portafolio' %}">Portafolio por cliente</a>
                <a class="nav-link" href="{% url 'consultas' %}">Consultas SQL</a>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        {% block contenido %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
